<!DOCTYPE html>
<html>
  <head>
    <title>Label</title>
    <style>
      .bar {
        width: 300px;
        height: 24px;
        border: 1px solid #333;
        background: #eee;
        overflow: hidden;
        border-radius: 4px;
      }
      .fill {
        height: 100%;
        background: #4caf50;
      }
      .addMore {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;

        width: 24px;
        height: 24px;

        border: 1px solid #ccc;
        border-radius: 50%;
        background-color: #eee;
        color: #555;

        cursor: help;
        font-weight: bold;
        text-align: center;
    }

    .addMore::after {
        content: attr(data-tooltip);
        position: absolute;
        z-index: 1000;

        bottom: calc(100% + 6px);
        right: 0;

        width: max-content;
        max-width: 300px;
        padding: 6px 9px;

        background: #333;
        color: white;
        border-radius: 4px;

        font-size: 13px;
        font-weight: normal;
        text-align: left;
        white-space: normal;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .addMore:hover::after {
        opacity: 1;
        visibility: visible;
    }
    .emotion-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
    }

    .emotion-row button {
        flex: 1;
        height: 30px;
        box-sizing: border-box;
    }

    .mydiv>button {
      grid-area: 1/1;
    }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="fill" style="width: {{ percent }}%;"></div>
    </div>
    <p>USER: {{USER}} </p>
    <p>{{ percent }}% finished</p>

    Label the tweet as the emotion that best describes the user's tweet.
    <p>TWEET: {{ TWEET }}</p>

    {% for emotion_id, emotion, definition in EMOTIONS %}
      <form action="" method="post">
        <div class="emotion-row">
          <button name="EMOTION" style="width:30%; height:30px;" value="{{ emotion_id }}">{{ emotion }}</button>
          <input type="hidden" name="EMOTION_ID" value="{{ emotion_id }}">
          <input type="hidden" name="TWEET_ID" value="{{ TWEET_ID }}">
          <span class="addMore" style="width:40px; height:20px; place-self:center end" data-tooltip="{{definition}}">?</span>
        </div>
      </form>
      {% endfor %}

    <form action="{{ url_for('logout') }}" method="post" enctype="multipart/form-data">
      <input type="submit" name="logout" value="Logout" />
    </form>
  </body>
</html>
