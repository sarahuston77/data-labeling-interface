<!DOCTYPE html>
<html>
  <head>
    <title>Label</title>
    <style>
      .bar {
        width: 300px;
        height: 24px;
        border: 1px solid #333;
        background: #eee;
        overflow: hidden;
        border-radius: 4px;
      }
      .fill {
        height: 100%;
        background: #4caf50;
      }
      .addMore {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 24px;
        height: 24px;

        border: 1px solid #ccc;
        border-radius: 50%;

        background-color: #eee;
        color: #555;

        cursor: help;
        font-weight: bold;
        text-align: center;
    }
    .addMore:hover {
        background-color: #ddd;
        border-color: #999;
    }
    .mydiv {
      display: grid;
    }

    .mydiv>button {
      grid-area: 1/1;
    }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="fill" style="width: {{ percent }}%;"></div>
    </div>
    <p>USER: {{USER}} </p>
    <p>{{ percent }}% finished</p>

    Label the tweet as the emotion that best describes the user's tweet.
    <p>TWEET: {{ TWEET }}</p>

    {% for emotion_id, emotion, definition in EMOTIONS %}
      <form action="" method="post">
        <div class="mydiv">
          <button name="EMOTION" style="width:30%; height:30px;" value="{{ emotion_id }}">{{ emotion }}</button>
          <input type="hidden" name="EMOTION_ID" value="{{ emotion_id }}">
          <input type="hidden" name="TWEET_ID" value="{{ TWEET_ID }}">
          <span class="addMore" style="width:40px; height:20px;place-self: center end" title="{{definition}}">?</span>
        </div>
      </form>
      {% endfor %}

    <form action="{{ url_for('logout') }}" method="post" enctype="multipart/form-data">
      <input type="submit" name="logout" value="Logout" />
    </form>
  </body>
</html>
