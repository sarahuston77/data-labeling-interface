<!DOCTYPE html>
<html>
  <head>
    <title>Label</title>
    <style>
      .bar {
        width: 300px;
        height: 24px;
        border: 1px solid #333;
        background: #eee;
        overflow: hidden;
        border-radius: 4px;
      }
      .fill {
        height: 100%;
        background: #4caf50;
      }
    .addMore{
      border: none;
      width: 32px;
      height: 32px;
      background-color: #eee;
      transition: all ease-in-out 0.2s;
      cursor: pointer;
    }
    .addMore:hover{
      border: 1px solid #888;
      background-color: #ddd;
    }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="fill" style="width: {{ percent }}%;"></div>
    </div>
    <p>USER: {{USER}} </p>
    <p>{{ percent }}% finished</p>

    Label the tweet as the emotion that best describes the user's tweet.
    <p>TWEET: {{ TWEET }}</p>

    {% for emotion_id, emotion, definition in EMOTIONS %}
      <form action="" method="post">
        <button name="EMOTION" value="{{ emotion_id }}">{{ emotion }}</button>
        <input type="hidden" name="EMOTION_ID" value="{{ emotion_id }}">
        <input type="hidden" name="TWEET_ID" value="{{ TWEET_ID }}">
        <button class="addMore" title={{definition}}>?</button>
      </form>
      {% endfor %}

    <form action="{{ url_for('logout') }}" method="post" enctype="multipart/form-data">
      <input type="submit" name="logout" value="Logout" />
    </form>
  </body>
</html>
